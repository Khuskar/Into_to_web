<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Resume Builder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar bg-white">
        <div class="container">
            <div class="navbar-content">
                <div class="brand-and-toggler">
                    <a href="{{ url_for('home') }}" class="navbar-brand">
                        <span class="navbar-brand-text">build <span>resume.</span></span>
                    </a>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-link">Dashboard</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- ===== ABOUT / FORM SECTION ===== -->
    <section id="about-sc">
        <div class="container">
            <div class="about-cnt">
                <form class="cv-form" id="cv-form">
                    <!-- ========= ABOUT ========= -->
                    <div class="cv-form-blk">
                        <div class="cv-form-row-title"><h3>about section</h3></div>

                        <div class="cv-form-row cv-form-row-about">
                            <div class="cols-3">
                                <div class="form-elem">
                                    <label class="form-label">First Name</label>
                                    <input name="firstname" type="text" class="form-control firstname"
                                           onkeyup="generateCV()" placeholder="e.g. John">
                                    <span class="form-text"></span>
                                </div>
                                <div class="form-elem">
                                    <label class="form-label">Middle Name <span class="opt-text">(optional)</span></label>
                                    <input name="middlename" type="text" class="form-control middlename"
                                           onkeyup="generateCV()" placeholder="e.g. Herbert">
                                    <span class="form-text"></span>
                                </div>
                                <div class="form-elem">
                                    <label class="form-label">Last Name</label>
                                    <input name="lastname" type="text" class="form-control lastname"
                                           onkeyup="generateCV()" placeholder="e.g. Doe">
                                    <span class="form-text"></span>
                                </div>
                            </div>

                            <div class="cols-3">
                                <div class="form-elem">
                                    <label class="form-label">Your Image</label>
                                    <input name="image" type="file" class="form-control image"
                                           accept="image/*" onchange="previewImage()">
                                </div>
                                <div class="form-elem">
                                    <label class="form-label">Designation</label>
                                    <input name="designation" type="text" class="form-control designation"
                                           onkeyup="generateCV()" placeholder="e.g. Sr. Accountant">
                                    <span class="form-text"></span>
                                </div>
                                <div class="form-elem">
                                    <label class="form-label">Address</label>
                                    <input name="address" type="text" class="form-control address"
                                           onkeyup="generateCV()" placeholder="e.g. Lake Street-23">
                                    <span class="form-text"></span>
                                </div>
                            </div>

                            <div class="cols-3">
                                <div class="form-elem">
                                    <label class="form-label">Email</label>
                                    <input name="email" type="text" class="form-control email"
                                           onkeyup="generateCV()" placeholder="e.g. johndoe@gmail.com">
                                    <span class="form-text"></span>
                                </div>
                                <div class="form-elem">
                                    <label class="form-label">Phone No:</label>
                                    <input name="phoneno" type="text" class="form-control phoneno"
                                           onkeyup="generateCV()" placeholder="e.g. 456-768-798">
                                    <span class="form-text"></span>
                                </div>
                                <div class="form-elem">
                                    <label class="form-label">Summary</label>
                                    <input name="summary" type="text" class="form-control summary"
                                           onkeyup="generateCV()">
                                    <span class="form-text"></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ========= ACHIEVEMENTS ========= -->
                    <div class="cv-form-blk">
                        <div class="cv-form-row-title"><h3>achievements</h3></div>

                        <div class="row-separator repeater">
                            <div class="repeater" data-repeater-list="group-a">
                                <div data-repeater-item>
                                    <div class="cv-form-row cv-form-row-achievement">
                                        <div class="cols-2">
                                            <div class="form-elem">
                                                <label class="form-label">Title</label>
                                                <input name="achieve_title" type="text"
                                                       class="form-control achieve_title"
                                                       onkeyup="generateCV()">
                                                <span class="form-text"></span>
                                            </div>
                                            <div class="form-elem">
                                                <label class="form-label">Description</label>
                                                <input name="achieve_description" type="text"
                                                       class="form-control achieve_description"
                                                       onkeyup="generateCV()">
                                                <span class="form-text"></span>
                                            </div>
                                        </div>
                                        <button data-repeater-delete type="button"
                                                class="repeater-remove-btn">-</button>
                                    </div>
                                </div>
                            </div>
                            <button type="button" data-repeater-create
                                    class="repeater-add-btn">+</button>
                        </div>
                    </div>

                    <!-- ========= EXPERIENCE ========= -->
                    <div class="cv-form-blk">
                        <div class="cv-form-row-title"><h3>experience</h3></div>

                        <div class="row-separator repeater">
                            <div class="repeater" data-repeater-list="group-b">
                                <div data-repeater-item>
                                    <div class="cv-form-row cv-form-row-experience">
                                        <div class="cols-3">
                                            <div class="form-elem">
                                                <label class="form-label">Title</label>
                                                <input name="exp_title" type="text"
                                                       class="form-control exp_title"
                                                       onkeyup="generateCV()">
                                                <span class="form-text"></span>
                                            </div>
                                            <div class="form-elem">
                                                <label class="form-label">Company / Organization</label>
                                                <input name="exp_organization" type="text"
                                                       class="form-control exp_organization"
                                                       onkeyup="generateCV()">
                                                <span class="form-text"></span>
                                            </div>
                                            <div class="form-elem">
                                                <label class="form-label">Location</label>
                                                <input name="exp_location" type="text"
                                                       class="form-control exp_location"
                                                       onkeyup="generateCV()">
                                                <span class="form-text"></span>
                                            </div>
                                        </div>

                                        <div class="cols-3">
                                            <div class="form-elem">
                                                <label class="form-label">Start Date</label>
                                                <input name="exp_start_date" type="date"
                                                       class="form-control exp_start_date"
                                                       onkeyup="generateCV()">
                                                <span class="form-text"></span>
                                            </div>
                                            <div class="form-elem">
                                                <label class="form-label">End Date</label>
                                                <input name="exp_end_date" type="date"
                                                       class="form-control exp_end_date"
                                                       onkeyup="generateCV()">
                                                <span class="form-text"></span>
                                            </div>
                                            <div class="form-elem">
                                                <label class="form-label">Description</label>
                                                <input name="exp_description" type="text"
                                                       class="form-control exp_description"
                                                       onkeyup="generateCV()">
                                                <span class="form-text"></span>
                                            </div>
                                        </div>

                                        <button data-repeater-delete type="button"
                                                class="repeater-remove-btn">-</button>
                                    </div>
                                </div>
                            </div>
                            <button type="button" data-repeater-create
                                    class="repeater-add-btn">+</button>
                        </div>
                    </div>

                    <!-- ========= EDUCATION ========= -->
                    <div class="cv-form-blk">
                        <div class="cv-form-row-title"><h3>education</h3></div>

                        <div class="row-separator repeater">
                            <div class="repeater" data-repeater-list="group-c">
                                <div data-repeater-item>
                                    <div class="cv-form-row cv-form-row-experience">
                                        <div class="cols-3">
                                            <div class="form-elem">
                                                <label class="form-label">School</label>
                                                <input name="edu_school" type="text"
                                                       class="form-control edu_school"
                                                       onkeyup="generateCV()">
                                                <span class="form-text"></span>
                                            </div>
                                            <div class="form-elem">
                                                <label class="form-label">Degree</label>
                                                <input name="edu_degree" type="text"
                                                       class="form-control edu_degree"
                                                       onkeyup="generateCV()">
                                                <span class="form-text"></span>
                                            </div>
                                            <div class="form-elem">
                                                <label class="form-label">City</label>
                                                <input name="edu_city" type="text"
                                                       class="form-control edu_city"
                                                       onkeyup="generateCV()">
                                                <span class="form-text"></span>
                                            </div>
                                        </div>

                                        <div class="cols-3">
                                            <div class="form-elem">
                                                <label class="form-label">Start Date</label>
                                                <input name="edu_start_date" type="date"
                                                       class="form-control edu_start_date"
                                                       onkeyup="generateCV()">
                                                <span class="form-text"></span>
                                            </div>
                                            <div class="form-elem">
                                                <label class="form-label">End Date</label>
                                                <input name="edu_graduation_date" type="date"
                                                       class="form-control edu_graduation_date"
                                                       onkeyup="generateCV()">
                                                <span class="form-text"></span>
                                            </div>
                                            <div class="form-elem">
                                                <label class="form-label">Description</label>
                                                <input name="edu_description" type="text"
                                                       class="form-control edu_description"
                                                       onkeyup="generateCV()">
                                                <span class="form-text"></span>
                                            </div>
                                        </div>

                                        <button data-repeater-delete type="button"
                                                class="repeater-remove-btn">-</button>
                                    </div>
                                </div>
                            </div>
                            <button type="button" data-repeater-create
                                    class="repeater-add-btn">+</button>
                        </div>
                    </div>

                    <!-- ========= PROJECTS ========= -->
                    <div class="cv-form-blk">
                        <div class="cv-form-row-title"><h3>projects</h3></div>

                        <div class="row-separator repeater">
                            <div class="repeater" data-repeater-list="group-d">
                                <div data-repeater-item>
                                    <div class="cv-form-row cv-form-row-experience">
                                        <div class="cols-3">
                                            <div class="form-elem">
                                                <label class="form-label">Project Name</label>
                                                <input name="proj_title" type="text"
                                                       class="form-control proj_title"
                                                       onkeyup="generateCV()">
                                                <span class="form-text"></span>
                                            </div>
                                            <div class="form-elem">
                                                <label class="form-label">Project Link</label>
                                                <input name="proj_link" type="text"
                                                       class="form-control proj_link"
                                                       onkeyup="generateCV()">
                                                <span class="form-text"></span>
                                            </div>
                                            <div class="form-elem">
                                                <label class="form-label">Description</label>
                                                <input name="proj_description" type="text"
                                                       class="form-control proj_description"
                                                       onkeyup="generateCV()">
                                                <span class="form-text"></span>
                                            </div>
                                        </div>
                                        <button data-repeater-delete type="button"
                                                class="repeater-remove-btn">-</button>
                                    </div>
                                </div>
                            </div>
                            <button type="button" data-repeater-create
                                    class="repeater-add-btn">+</button>
                        </div>
                    </div>

                    <!-- ========= SKILLS ========= -->
                    <div class="cv-form-blk">
                        <div class="cv-form-row-title"><h3>skills</h3></div>

                        <div class="row-separator repeater">
                            <div class="repeater" data-repeater-list="group-e">
                                <div data-repeater-item>
                                    <div class="cv-form-row cv-form-row-skills">
                                        <div class="form-elem">
                                            <label class="form-label">Skill</label>
                                            <input name="skill" type="text"
                                                   class="form-control skill"
                                                   onkeyup="generateCV()">
                                            <span class="form-text"></span>
                                        </div>
                                        <button data-repeater-delete type="button"
                                                class="repeater-remove-btn">-</button>
                                    </div>
                                </div>
                            </div>
                            <button type="button" data-repeater-create
                                    class="repeater-add-btn">+</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- ===== PREVIEW SECTION ===== -->
    <section id="preview-sc" class="print_area">
        <div class="container">
            <div class="preview-cnt">
                <!-- LEFT COLUMN -->
                <div class="preview-cnt-l bg-green text-white">
                    <div class="preview-blk">
                        <div class="preview-image">
                            <img src="" alt="" id="image_dsp">
                        </div>
                        <div class="preview-item preview-item-name">
                            <span class="preview-item-val fw-6"
                                  id="fullname_dsp"></span>
                        </div>
                        <div class="preview-item">
                            <span class="preview-item-val text-uppercase fw-6 ls-1"
                                  id="designation_dsp"></span>
                        </div>
                    </div>

                    <div class="preview-blk">
                        <div class="preview-blk-title"><h3>about</h3></div>
                        <div class="preview-blk-list">
                            <div class="preview-item">
                                <span class="preview-item-val" id="phoneno_dsp"></span>
                            </div>
                            <div class="preview-item">
                                <span class="preview-item-val" id="email_dsp"></span>
                            </div>
                            <div class="preview-item">
                                <span class="preview-item-val" id="address_dsp"></span>
                            </div>
                            <div class="preview-item">
                                <span class="preview-item-val" id="summary_dsp"></span>
                            </div>
                        </div>
                    </div>

                    <div class="preview-blk">
                        <div class="preview-blk-title"><h3>skills</h3></div>
                        <div class="skills-items preview-blk-list"
                             id="skills_dsp"></div>
                    </div>
                </div>

                <!-- RIGHT COLUMN -->
                <div class="preview-cnt-r bg-white">
                    <div class="preview-blk">
                        <div class="preview-blk-title"><h3>Achievements</h3></div>
                        <div class="achievements-items preview-blk-list"
                             id="achievements_dsp"></div>
                    </div>

                    <div class="preview-blk">
                        <div class="preview-blk-title"><h3>educations</h3></div>
                        <div class="educations-items preview-blk-list"
                             id="educations_dsp"></div>
                    </div>

                    <div class="preview-blk">
                        <div class="preview-blk-title"><h3>experiences</h3></div>
                        <div class="experiences-items preview-blk-list"
                             id="experiences_dsp"></div>
                    </div>

                    <div class="preview-blk">
                        <div class="preview-blk-title"><h3>projects</h3></div>
                        <div class="projects-items preview-blk-list"
                             id="projects_dsp"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ===== PRINT BUTTON ===== -->
    <section class="print-btn-sc">
        <div class="container">
            <button type="button"
                    class="save-btn btn btn-secondary"
                    onclick="saveResume()">Save Resume</button>

            <button type="button"
                    class="print-btn btn btn-primary"
                    onclick="printCV()">Print CV</button>
        </div>
    </section>

    <!-- ===== SCRIPTS ===== -->
    <script src="https://code.jquery.com/jquery-3.6.4.js"
            integrity="sha256-a9jBBRygX1Bh5lt8GZjXDzyOB+bWve9EiO7tROUtj/E="
            crossorigin="anonymous"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.repeater/1.2.1/jquery.repeater.js"
            integrity="sha512-bZAXvpVfp1+9AUHQzekEZaXclsgSlAeEnMJ6LfFAvjqYUVZfcuVXeQoN5LhD7Uw0Jy4NCY9q3kbdEXbwhZUmUQ=="
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
